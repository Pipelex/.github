# The CLA Assistant, shared by every Pipelex repository that asks contributors to sign a CLA.
#
# A repository calls it with the same short stub, the one in docs/shared-workflows.md, and passes
# its secrets with `secrets: inherit`. Everything that differs between repositories is read from the
# calling repository: its name, its organization, and its own CLA.md on `main`. Signatures are kept in
# `<organization>/cla-signatures`, so a contributor who signs once is signed for every repository.
name: CLA Assistant

on:
  workflow_call:
    secrets:
      CLA_GH_APP_ID:
        required: true
      CLA_GH_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLA_GH_APP_ID }}
          private-key: ${{ secrets.CLA_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            cla-signatures
            ${{ github.event.repository.name }}

      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: main
          allowlist: ${{ vars.CLA_ALLOWLIST }}
          remote-organization-name: ${{ github.repository_owner }}
          remote-repository-name: cla-signatures
          signed-commit-message: $contributorName has signed the CLA in $owner/$repo#$pullRequestNo
