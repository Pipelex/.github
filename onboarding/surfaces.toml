# The manifest of every surface that carries onboarding text from this tree.
#
# It is the machine form of the include and adapt rows of the workspace inventory
# (docs/marketing/surfaces.md in the Pipelex meta-repo), which stays the page a person
# reads. The workspace command reads this file from the sibling checkouts: `check`
# reports every region that differs from its rendered assembly, `diff` shows what
# `apply` would write, and `apply` rewrites the regions and touches nothing outside them.
#
# A surface has a mode. `include` means the surface carries the rendered assembly verbatim
# between its markers, and nobody edits it there. `adapt` means the surface is hand-written
# from the blocks in a format that takes no region, and records instead the commit of the
# rendered assembly it was last re-read against — its stamp — so that a change here ends
# with a printed list of what a person re-reads by hand.
#
# The adapt rows and the stamps arrive with the workspace command. This first cut holds the
# two include rows the first push installs, and nothing else.

[[surface]]
repo = "pipelex"
path = "README.md"
mode = "include"
assembly = "front-door"

[[surface]]
repo = "pipelex-mcp"
path = "README.md"
mode = "include"
assembly = "mcp-route"
